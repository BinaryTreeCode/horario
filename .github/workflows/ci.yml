# CI — Nature Planner
# Bun install → test → build. Sin secrets: la app compila y los tests
# corren en modo local (sin DATABASE_URL, db.ts cae al proxy de fallback).

name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun test

      - name: Build
        run: bun run build
        env:
          # Evita que el adapter Vercel intente requerir un token/deploy en CI
          VERCEL: 'false'
