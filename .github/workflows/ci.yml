# CI — Nature Planner
# Bun install → test → build → a11y E2E (Playwright + axe-core).
# Sin secrets: la app compila y los tests corren en modo local
# (sin DATABASE_URL, db.ts cae al proxy de fallback).

name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun test

      - name: Build
        run: bun run build
        env:
          # Evita que el adapter Vercel intente requerir un token/deploy en CI
          VERCEL: 'false'

      # Regresión de accesibilidad: axe en Semana/Día/modales + targets 44px.
      # Falla el pipeline si entra cualquier violación nueva.
      - name: Instalar navegador de Playwright
        run: bunx playwright install --with-deps chromium

      - name: Accesibilidad E2E (axe-core)
        run: bun run test:a11y
